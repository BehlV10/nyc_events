<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Schedule | NYC Events</title>
<meta name="description" content="A plan for the weekend, made on NYC Events.">
<meta name="robots" content="noindex">
<meta property="og:title" content="See my schedule">
<meta property="og:description" content="What I'm planning to do around New York, made on NYC Events.">
<meta property="og:image" content="https://behlv10.github.io/nyc_events/og-things-to-do-nyc-this-weekend.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>
  // Follow the theme picked on the main site: light if chosen, otherwise the site's dark look.
  try {
    if (localStorage.getItem('nyc_events_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
</script>
<style>
  :root { --bg: #0c0e14; --card: #151822; --line: #2a2f3e; --fg: #eef1f8; --muted: #a2abc0; --blue: #7fb0ff; --gold: #ffd866; --on-blue: #0c0e14; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f5f6fa; --card: #ffffff; --line: #d8dce8; --fg: #171b28; --muted: #566077; --blue: #1f5fd0; --gold: #8a6500; --on-blue: #ffffff; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 1040px; margin: 0 auto; padding-block: 32px 56px; display: grid; gap: 24px; }
  .brand { color: var(--muted); text-decoration: none; font-size: 14px; }
  h1 { font: 400 clamp(2.2rem, 7vw, 3.4rem)/1.05 Impact, "Arial Narrow Bold", "Arial Black", sans-serif; letter-spacing: .01em; margin: 8px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
  .sub { color: var(--muted); margin: 8px 0 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-block; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 9px 14px; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
  .btn:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .days { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); align-items: start; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
  .day h2 { margin: 0; font-size: 16px; color: var(--gold); }
  .day ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .ev { display: grid; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); min-width: 0; }
  .ev:first-child { border-top: 0; padding-top: 0; }
  .time { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .title { font-weight: 700; overflow-wrap: anywhere; }
  .title a { color: var(--blue); }
  .venue, .cal { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .cal a { color: inherit; }
  .empty { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .empty h2 { margin: 0 0 6px; }
  .empty p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="../">NYC Events</a>
    <h1 id="title">My Schedule</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="actions" id="actions" hidden>
    <button type="button" class="btn primary" id="add-all">Add all to my calendar</button>
    <a class="btn" href="../">Make your own schedule</a>
  </div>
  <section class="days" id="days" aria-label="Schedule by day"></section>
  <section class="empty" id="empty" hidden>
    <h2 id="empty-title">This link doesn't have a schedule in it</h2>
    <p><span id="empty-text">It may have been cut off when it was sent. Ask for the link again, or</span> <a href="../">browse events</a> to make your own.</p>
  </section>
</main>
<script>
(function () {
  var TZ = 'America/New_York';
  var HOURS = 2;   // listings have no end time
  var KEEP_SECONDS = 86400;   // an event drops off a day after it starts

  function fromBase64(text) {
    var bin = atob(text.split('-').join('+').split('_').join('/'));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function decode(hash) {
    var tag = hash.charAt(0), bytes = fromBase64(hash.slice(1));
    if (tag === 'z') {
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    } else if (tag !== 'j') {
      throw new Error('unknown format');
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  // The link is written by whoever sent it, so everything in it is treated as untrusted:
  // text only ever goes in through textContent, and links must be http(s).
  function safeUrl(u) {
    try {
      var url = new URL(u);
      return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : '';
    } catch (e) { return ''; }
  }

  function clean(data) {
    var out = [];
    (data && Array.isArray(data.e) ? data.e : []).forEach(function (r) {
      if (!Array.isArray(r)) return;
      var epoch = Number(r[1]);
      if (!r[0] || !isFinite(epoch) || epoch <= 0 || epoch < Date.now() / 1000 - KEEP_SECONDS) return;
      out.push({ title: String(r[0]).slice(0, 200), epoch: epoch, venue: String(r[2] || '').slice(0, 120), url: safeUrl(r[3]), untimed: !!r[4] });
    });
    return out.sort(function (a, b) { return a.epoch - b.epoch; });
  }

  function fmt(epoch, opts) {
    return new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: TZ }, opts)).format(new Date(epoch * 1000));
  }

  function timeLabel(epoch) {
    return fmt(epoch, { hour: 'numeric', minute: '2-digit' });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  function utc(d) {
    return d.toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  }

  function dayStamp(epoch, plusDays) {
    var d = new Date(fmt(epoch + (plusDays || 0) * 86400, { year: 'numeric', month: '2-digit', day: '2-digit' }));
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }

  function googleLink(ev) {
    var start = new Date(ev.epoch * 1000), end = new Date(start.getTime() + HOURS * 3600000);
    var dates = ev.untimed ? dayStamp(ev.epoch) + '/' + dayStamp(ev.epoch, 1) : utc(start) + '/' + utc(end);
    var p = new URLSearchParams({ action: 'TEMPLATE', text: ev.title, dates: dates, location: ev.venue, details: ev.url });
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  }

  function icsText(s) {
    return s.replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, ' ');
  }

  function downloadIcs(events, name) {
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//NYC Events//My Schedule//EN'];
    events.forEach(function (ev, i) {
      var start = new Date(ev.epoch * 1000), end = new Date(start.getTime() + HOURS * 3600000);
      lines.push('BEGIN:VEVENT', 'UID:' + ev.epoch + '-' + i + '@behlv10.github.io', 'DTSTAMP:' + utc(new Date()));
      if (ev.untimed) lines.push('DTSTART;VALUE=DATE:' + dayStamp(ev.epoch), 'DTEND;VALUE=DATE:' + dayStamp(ev.epoch, 1));
      else lines.push('DTSTART:' + utc(start), 'DTEND:' + utc(end));
      lines.push('SUMMARY:' + icsText(ev.title), 'LOCATION:' + icsText(ev.venue));
      if (ev.url) lines.push('URL:' + icsText(ev.url));
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar' }));
    a.download = name + '.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function isWeekend(days) {
    return days.length <= 3 && days.every(function (d) { return ['Fri', 'Sat', 'Sun'].indexOf(d.weekday) !== -1; });
  }

  function render(data) {
    var events = clean(data);
    if (!events.length) throw new Error('no events');
    var name = String(data.n || '').trim().slice(0, 40);
    var days = [], byKey = {};
    events.forEach(function (ev) {
      var key = fmt(ev.epoch, { year: 'numeric', month: '2-digit', day: '2-digit' });
      if (!byKey[key]) {
        byKey[key] = { label: fmt(ev.epoch, { weekday: 'long', month: 'short', day: 'numeric' }), weekday: fmt(ev.epoch, { weekday: 'short' }), events: [] };
        days.push(byKey[key]);
      }
      byKey[key].events.push(ev);
    });
    var kind = isWeekend(days) ? 'weekend' : 'schedule';
    var heading = name ? name + (/s$/i.test(name) ? "' " : "'s ") + kind : (kind === 'weekend' ? 'A weekend plan' : 'A schedule');
    document.getElementById('title').textContent = heading;
    document.title = heading + ' | NYC Events';
    document.getElementById('sub').textContent = events.length + (events.length === 1 ? ' event' : ' events') +
      ' · ' + days[0].label + (days.length > 1 ? ' to ' + days[days.length - 1].label : '');

    var root = document.getElementById('days');
    days.forEach(function (day) {
      var box = el('article', 'day');
      box.appendChild(el('h2', '', day.label));
      var list = el('ol');
      day.events.forEach(function (ev) {
        var item = el('li', 'ev');
        var when = ev.untimed ? '' : timeLabel(ev.epoch);
        if (when) item.appendChild(el('div', 'time', when));
        var title = el('div', 'title');
        if (ev.url) {
          var a = el('a', '', ev.title);
          a.href = ev.url; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow';
          title.appendChild(a);
        } else {
          title.textContent = ev.title;
        }
        item.appendChild(title);
        if (ev.venue) item.appendChild(el('div', 'venue', ev.venue));
        var cal = el('div', 'cal'), g = el('a', '', 'Add to Google Calendar');
        g.href = googleLink(ev); g.target = '_blank'; g.rel = 'noopener noreferrer';
        cal.appendChild(g);
        item.appendChild(cal);
        list.appendChild(item);
      });
      box.appendChild(list);
      root.appendChild(box);
    });
    document.getElementById('actions').hidden = false;
    document.getElementById('add-all').addEventListener('click', function () {
      downloadIcs(events, name ? name.replace(/[^\w-]+/g, '-') + '-schedule' : 'my-schedule');
    });
  }

  function showEmpty() {
    document.getElementById('title').textContent = 'My Schedule';
    if (ended) {
      document.getElementById('empty-title').textContent = 'This schedule has ended';
      document.getElementById('empty-text').textContent = 'All of its events have passed. You can';
    }
    document.getElementById('empty').hidden = false;
  }

  var hash = location.hash.slice(1);
  var ended = false;
  if (hash) {
    decode(hash).then(function (data) {
      ended = data && Array.isArray(data.e) && data.e.length > 0;
      render(data);
    }).catch(showEmpty);
  } else {
    showEmpty();
  }
})();
</script>
</body>
</html>
