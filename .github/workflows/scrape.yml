name: Scrape events and deploy site

on:
  schedule:
    # Twice a day: 10:00 UTC (5-6am ET) for the daily snapshot, 19:00 UTC (2-3pm ET) to catch
    # same-day additions and cancellations. Throttled hosts are paced, so a run takes ~15-20 min.
    - cron: "0 10,19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache venue scrapers
        uses: actions/cache@v4
        with:
          path: .cache/venues
          key: venue-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            venue-cache-${{ runner.os }}-

      - name: Unit tests
        run: python -m unittest discover tests

      # Run-to-run state lives on the `data` branch (one commit, replaced every run), not main.
      - name: Restore geocode cache from the data branch
        run: |
          if git fetch -q --depth=1 origin data; then
            git show FETCH_HEAD:geocode_cache.json > geocode_cache.json || true
          fi

      - run: python server.py export events.json
      - name: Curate daily editor's picks
        run: python scripts/curate_highlights.py
      # Also writes landing pages, sitemap/robots/llms.txt, RSS/iCal feeds, and OG images,
      # which ship in the Pages artifact below without being committed.
      - run: python server.py export html index.html
      - run: cp index.html events.html

      - name: Check output
        run: |
          # Guard against publishing corrupted or zero-byte output
          if [ ! -s events.json ] || [ $(wc -c < events.json) -lt 100000 ]; then
            echo "ERROR: Corrupt or zero-byte events.json ($(wc -c < events.json 2>/dev/null || echo 0) bytes)."
            exit 1
          fi
          if [ ! -s index.html ] || [ $(wc -c < index.html) -lt 100000 ]; then
            echo "ERROR: Corrupt or zero-byte index.html."
            exit 1
          fi

      - name: Publish latest data snapshot to the data branch
        run: |
          # The generated site ships in the Pages artifact below. The latest events.json (and the
          # geocode cache the next run needs) go to `data` as a single parentless commit that
          # replaces the previous one, so old ~50 MB snapshots don't pile up in git history.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/data" && mkdir -p "$RUNNER_TEMP/data"
          cp events.json geocode_cache.json "$RUNNER_TEMP/data/"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data.index"
          git --work-tree="$RUNNER_TEMP/data" add -A .
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)")
          unset GIT_INDEX_FILE
          git push -f origin "$commit:refs/heads/data"

      - name: Commit small state files to main if changed
        run: |
          git add highlights.json luckyseat_shows.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update highlights: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3; do
              git push && break
              echo "git push attempt $i failed; retrying..."
              sleep $((i * 5))
              git fetch origin main
              git merge origin/main -X ours --no-edit || true
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: scrape
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ping IndexNow (scheduled runs)
        continue-on-error: true
        run: python scripts/ping_indexnow.py ${{ github.event_name == 'schedule' && '--force' || '' }}
