name: Scrape events

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python server.py export events.json
      - run: python server.py export html index.html
      - run: cp index.html events.html

      - name: Commit data and static site if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json index.html events.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update events and site: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
