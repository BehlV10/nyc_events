name: Process Community Submission

on:
  repository_dispatch:
    types: [community-event, suggest-venue]
  workflow_dispatch:
    inputs:
      submission_type:
        description: "Type: event or venue"
        required: true
        default: "event"
      payload_json:
        description: "JSON payload"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: community-submissions
  cancel-in-progress: false

jobs:
  process_submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Event submission branch
      - name: Process community event (repository_dispatch)
        if: github.event_name == 'repository_dispatch' && github.event.action == 'community-event'
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python scripts/add_community_event.py "$EVENT_PAYLOAD"

      - name: Process community event (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.submission_type == 'event'
        env:
          EVENT_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          python scripts/add_community_event.py "$EVENT_PAYLOAD"

      # Venue suggestion branch
      - name: Process venue suggestion (repository_dispatch)
        if: github.event_name == 'repository_dispatch' && github.event.action == 'suggest-venue'
        env:
          VENUE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python scripts/add_suggested_venue.py "$VENUE_PAYLOAD"

      - name: Process venue suggestion (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.submission_type == 'venue'
        env:
          VENUE_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          python scripts/add_suggested_venue.py "$VENUE_PAYLOAD"

      - name: Commit the submission
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community_events.json suggested_venues.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Process community submission: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The site is built and deployed by the scrape workflow (generated HTML is not committed).
      # A push made with GITHUB_TOKEN doesn't trigger workflows, so dispatch it explicitly; venue
      # caches keep that run short.
      - name: Rebuild and deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape.yml --ref main
