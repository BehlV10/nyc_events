name: Process Community Submission

on:
  repository_dispatch:
    types: [community-event, suggest-venue]
  workflow_dispatch:
    inputs:
      submission_type:
        description: "Type: event or venue"
        required: true
        default: "event"
      payload_json:
        description: "JSON payload"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  process_submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Event submission branch
      - name: Process community event (repository_dispatch)
        if: github.event_name == 'repository_dispatch' && github.event.action == 'community-event'
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python scripts/add_community_event.py "$EVENT_PAYLOAD"

      - name: Process community event (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.submission_type == 'event'
        env:
          EVENT_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          python scripts/add_community_event.py "$EVENT_PAYLOAD"

      # Venue suggestion branch
      - name: Process venue suggestion (repository_dispatch)
        if: github.event_name == 'repository_dispatch' && github.event.action == 'suggest-venue'
        env:
          VENUE_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python scripts/add_suggested_venue.py "$VENUE_PAYLOAD"

      - name: Process venue suggestion (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.submission_type == 'venue'
        env:
          VENUE_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          python scripts/add_suggested_venue.py "$VENUE_PAYLOAD"

      - name: Commit updated files and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community_events.json suggested_venues.json events.json index.html events.html
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Process community submission: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: process_submission
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
